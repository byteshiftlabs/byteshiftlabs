name: Update Profile Views

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-views:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update view count from GitHub Traffic API
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_PAT }}
        run: python3 .github/scripts/update_views.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/view-state.json README.md
          git diff --cached --quiet || git commit -m "Update profile view count [skip ci]"
          git push
